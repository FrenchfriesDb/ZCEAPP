<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Sky-Sync theme example">
  <defs>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56daff"/>
      <stop offset="45%" stop-color="#7b9dff"/>
      <stop offset="100%" stop-color="#8d5cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#04070f"/>
  <text x="160" y="110" fill="#dff5ff" font-size="42" font-family="Outfit, sans-serif">Sky-Sync Example</text>
  <rect x="160" y="150" width="410" height="380" rx="28" fill="url(#free)" stroke="#8aa7d9" stroke-opacity="0.45"/>
  <text x="220" y="215" fill="#dff5ff" font-size="30" font-family="Outfit, sans-serif">Static Dark</text>
  <rect x="260" y="255" width="210" height="34" rx="16" fill="#cfd8ea"/>
  <rect x="260" y="310" width="150" height="22" rx="11" fill="#72839e"/>
  <rect x="630" y="150" width="410" height="380" rx="28" fill="url(#pro)" stroke="#79f4ff" stroke-opacity="0.9"/>
  <text x="700" y="215" fill="#06111d" font-size="30" font-family="Outfit, sans-serif">Sky-Sync Pro</text>
  <rect x="730" y="255" width="210" height="34" rx="16" fill="#f7fcff"/>
  <rect x="730" y="310" width="150" height="22" rx="11" fill="#12233a" opacity="0.55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Sky-Sync theme example">
  <defs>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12110f"/>
      <stop offset="100%" stop-color="#1c1a17"/>
    </linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcba79"/>
      <stop offset="45%" stop-color="#e3d497"/>
      <stop offset="100%" stop-color="#ddbf7e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#0a0a09"/>
  <text x="160" y="110" fill="#f4f1ea" font-size="42" font-family="Outfit, sans-serif">Sky-Sync Example</text>
  <rect x="160" y="150" width="410" height="380" rx="28" fill="url(#free)" stroke="#cabf99" stroke-opacity="0.45"/>
  <text x="220" y="215" fill="#f4f1ea" font-size="30" font-family="Outfit, sans-serif">Static Dark</text>
  <rect x="260" y="255" width="210" height="34" rx="16" fill="#e7e1d2"/>
  <rect x="260" y="310" width="150" height="22" rx="11" fill="#968f7a"/>
  <rect x="630" y="150" width="410" height="380" rx="28" fill="url(#pro)" stroke="#e3c595" stroke-opacity="0.9"/>
  <text x="700" y="215" fill="#131210" font-size="30" font-family="Outfit, sans-serif">Sky-Sync Pro</text>
  <rect x="730" y="255" width="210" height="34" rx="16" fill="#fcfcfa"/>
  <rect x="730" y="310" width="150" height="22" rx="11" fill="#2a2722" opacity="0.55"/>
</svg>
